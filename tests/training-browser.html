<!doctype html><meta charset="utf-8"><title>修行强化 · 构造检查</title><style>body{margin:0;background:#eee9dd;color:#284b40;font:14px system-ui}header{padding:6px}button{padding:7px;margin:2px}iframe{display:block;width:1280px;height:800px;border:0}pre{white-space:pre-wrap;max-height:160px;overflow:auto}</style>
<header>构造验证 · 仅测试按钮设定状态，不算正常试玩<br><button id="cards">弓强化卡</button><button id="recover">养息卡</button><button id="narrow">窄屏 390</button><button id="wide">桌面 1280</button><button id="check">运行回归</button><span id="status">载入中</span><details><summary>报告</summary><pre id="report"></pre></details></header><iframe id="frame" src="../index.html?test=1&revision=016"></iframe>
<script>
const f=document.getElementById('frame');let r;f.onload=()=>document.getElementById('status').textContent='就绪';
function scene(id='weapon'){const w=f.contentWindow;r=new w.XJ.Run(42,'bow','standard');r.level=2;r.step=()=>{};r.openChoice();r.choices=['gate','gold',id];w.xuanjian.test.setRun(r);return r;}
document.getElementById('cards').onclick=()=>scene();document.getElementById('recover').onclick=()=>scene('recovery');document.getElementById('narrow').onclick=()=>{f.style.width='390px';f.style.height='844px';};document.getElementById('wide').onclick=()=>{f.style.width='1280px';f.style.height='800px';};
document.getElementById('check').onclick=async()=>{const results=[],check=(name,v)=>results.push({name,pass:!!v}),wait=()=>new Promise(r=>setTimeout(r,220));try{scene();const d=f.contentDocument,w=f.contentWindow;const card=d.querySelector('.training-card');check('卡片显示阶数、实际箭数与边界',card.textContent.includes('0 → 1 阶')&&card.textContent.includes('每轮 1 箭 → 每轮 2 箭')&&card.textContent.includes('被动')&&card.textContent.includes('帝观元'));check('三选一保留两道神通',d.querySelectorAll('.decision-card').length===3&&d.querySelectorAll('.training-card').length===1);d.querySelector('[data-choice="2"]').click();await wait();check('实际选择增加习器、保留神通与寿元',r.trainingLv('weapon')===1&&r.lv('weapon')===0&&r.life===8);check('选后反馈显示箭数',d.getElementById('notice').textContent.includes('每轮 2 箭'));d.getElementById('pause').click();check('暂停提供强化入口',!!d.querySelector('.training-summary')&&d.querySelector('.training-summary').textContent.includes('习弓'));d.querySelector('.training-summary summary').click();check('当前阶数可展开查看',d.querySelector('.training-summary').open&&d.querySelector('.training-summary').textContent.includes('1/2 阶'));d.getElementById('pauseBook').click();check('神通谱包含强化全集与原作边界',d.getElementById('panel').textContent.includes('养息')&&d.getElementById('panel').textContent.includes('不是原著神通'));d.getElementById('bookClose').click();d.getElementById('endRun').click();check('结算记录真实强化',r.result.training.weapon===1&&d.getElementById('panel').textContent.includes('习弓'));check('修行录保存真实强化',w.XJArchive.data.records.at(-1).training.weapon===1);scene('recovery');check('养息常驻显示不可复活与寿元边界',d.querySelector('.training-card').textContent.includes('不恢复寿元，不救致死'));d.querySelector('[data-choice="2"]').click();await wait();check('养息选择落入独立强化字段',r.trainingLv('recovery')===1&&r.lv('recovery')===0);d.getElementById('pause').click();scene();f.style.width='390px';f.style.height='844px';await wait();const panel=d.getElementById('panel'),cards=[...d.querySelectorAll('.decision-card')];check('窄屏内容没有水平溢出',panel.scrollWidth<=panel.clientWidth+2&&d.documentElement.scrollWidth<=390);check('卡片字号至少14px、按钮可点击尺寸',cards.every(c=>parseFloat(w.getComputedStyle(c.querySelector('.decision-purpose')).fontSize)>=14&&c.querySelector('button').getBoundingClientRect().height>=40));}catch(e){results.push({name:'exception',pass:false,error:e.stack});}const out={method:'constructed DOM UI actions, not normal play',passed:results.filter(x=>x.pass).length,total:results.length,results};document.getElementById('report').textContent=JSON.stringify(out,null,2);document.getElementById('status').textContent=out.passed+'/'+out.total;};
</script>
