<!doctype html><meta charset="utf-8"><title>浏览器构造场景验收 · 独立于正常试玩</title><style>body{margin:0;background:#f3f4ef;color:#454d43;font:12px system-ui}header{height:100px;padding:12px 20px;box-sizing:border-box}button{padding:6px 12px;margin:3px;background:#fff;border:1px solid #ccd4c3;color:#44543e;border-radius:4px}iframe{border:0;width:100vw;height:calc(100vh - 100px)}#report{font:11px monospace;white-space:pre-wrap;max-height:50vh;overflow:auto;background:#f8faf5}h1{font:14px system-ui;margin:0 0 7px}</style><header><h1>构造场景验收页 · 不代表正常随机成型或真实手感</h1><button id="logic">运行浏览器场景断言</button><button id="late">展示六敌种 + 果位战场</button><button id="death">构造死亡</button><button id="upgrade">构造升级</button><button id="restart">重载正常开局</button><span id="status">等待游戏就绪</span></header><div id="report" hidden></div><iframe id="frame" src="../index.html?test=1"></iframe><script>
const f=document.getElementById('frame'),report=document.getElementById('report'),status=document.getElementById('status');f.onload=()=>status.textContent='Phaser 游戏已载入';let logs=[];function assert(n,v){logs.push({name:n,pass:!!v});if(!v)throw Error(n);}function quiet(r){r.spawnTimer=r.bossAt=r.eventAt=r.eliteAt=1e8;return r;}const e=(r,type,x=1700,y=1100)=>{let q=r.spawn(type,false,x,y);q.born=0;return q;};
document.getElementById('logic').onclick=()=>{logs=[];let w=f.contentWindow,X=w.XJ,r;try{
r=quiet(new X.Run(778));r.getXP(r.need);r.nextChoice();w.xuanjian.test.setRun(r);assert('升级弹层显示',!w.document.getElementById('overlay').hidden&&w.document.querySelectorAll('[data-choice]').length===3);let t=r.t,x=r.p.x;for(let i=0;i<60;i++)r.step(1/60,{x:1});assert('选择中时间和位置冻结',r.t===t&&r.p.x===x);w.document.querySelector('[data-choice]').click();assert('真实 DOM 选择按钮恢复战斗',r.state==='running'&&w.document.getElementById('overlay').hidden);
r=quiet(new X.Run(779));for(let id of X.RECIPE.ids.slice(0,4))r.skills[id]=1;r.skills.pure=1;r.openChoice();r.choices=['light','gate','mountain'];w.xuanjian.test.setRun(r);w.document.querySelector('[data-choice="0"]').click();assert('五法加异道，选择后激活果位',r.fruit&&r.lv('pure')===1&&Object.keys(r.skills).length===6);assert('UI 展示果位',w.document.getElementById('skillChips').textContent.includes('明阳果位'));
r=quiet(new X.Run(780));r.giftPending=true;r.nextChoice();w.xuanjian.test.setRun(r);w.document.querySelector('[data-choice="1"]').click();assert('受箓 DOM 选择独立',r.gift==='life'&&Object.keys(r.skills).length===0);r.p.mp=0;r.lifeUse();assert('Q 对应动作有限耗寿',r.life===7&&r.p.mp===80);r.cool.life=0;r.life=0;assert('寿元耗尽不能施放',!r.lifeUse());
r=quiet(new X.Run(781));let b=e(r,6);r.hit(b,1e6);r.gift='whale';w.xuanjian.test.setRun(r);for(let i=0;i<200;i++){if(r.state==='choice')r.choose(0);r.step(.05);}assert('首领死亡后继续十秒',r.bosses===1&&r.t>9.9&&r.state!=='ended');
r=quiet(new X.Run(782));r.p.hp=1;r.hurt(9);w.xuanjian.test.setRun(r);assert('死亡结算 DOM',w.document.getElementById('panel').textContent.includes('身死道消'));w.document.getElementById('sameSeed').click();assert('同种重开清空状态',w.xuanjian.run.t<.1&&w.xuanjian.run.p.hp===100&&Object.keys(w.xuanjian.run.skills).length===0);
w.document.getElementById('pause').click();assert('暂停按钮生效',w.xuanjian.run.state==='paused');w.document.getElementById('endRun').click();assert('主动结束结算',w.xuanjian.run.result.reason==='主动结束');w.document.getElementById('restart').click();assert('重新选器物',w.document.querySelectorAll('[data-item]').length===2);w.document.querySelector('[data-item="bow"]').click();assert('器物更换须重开',w.xuanjian.run.item==='bow');let m=w.xuanjian.muted;w.document.getElementById('mute').click();assert('静音开关状态',w.xuanjian.muted!==m);w.document.getElementById('pause').click();status.textContent='场景断言 '+logs.length+' 项全部通过';
}catch(err){status.textContent='失败：'+err.message;}report.hidden=false;report.textContent=JSON.stringify(logs,null,2);};
document.getElementById('late').onclick=()=>{report.hidden=true;let w=f.contentWindow,r=quiet(new w.XJ.Run(907));for(let s of w.XJ.SKILLS)r.skills[s.id]=2;r.fruit=r.recipe();r.gift='whale';r.p.mp=160;r.t=367;r.cool.gate=r.cool.edict=r.cool.dusk=r.cool.light=r.cool.mountain=0;for(let i=0;i<18;i++){let a=i*Math.PI/9;e(r,i%6,1600+Math.cos(a)*260,1100+Math.sin(a)*230);}e(r,6,1970,1000);r.spawnTimer=1;w.xuanjian.test.setRun(r);status.textContent='构造场景运行中：有预置神通和敌人';};
document.getElementById('death').onclick=()=>{let w=f.contentWindow,r=quiet(new w.XJ.Run(34));r.p.hp=1;r.hurt(10);w.xuanjian.test.setRun(r);};document.getElementById('upgrade').onclick=()=>{let w=f.contentWindow,r=quiet(new w.XJ.Run(34));r.getXP(r.need);r.nextChoice();w.xuanjian.test.setRun(r);};document.getElementById('restart').onclick=()=>f.src='../index.html?test=1';
</script>
