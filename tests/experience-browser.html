<!doctype html><meta charset="utf-8"><title>试玩体验 · 构造检查</title><style>body{margin:0;background:#eee9dd;color:#284b40;font:14px system-ui}header{padding:8px}button{padding:8px;margin:3px}iframe{width:100%;height:800px;border:0}pre{white-space:pre-wrap;max-height:150px;overflow:auto}</style>
<header>构造界面与状态检查，不代表自然成型或完整通关。
<button id="checks">运行体验回归</button><button id="upgrade">三重选卡</button><button id="screen">持屏选卡</button><button id="crowd">密集战场</button><button id="gift">受箓</button><button id="finish">结算</button><span id="status">等待载入</span><details><summary>回归结果</summary><pre id="report"></pre></details></header><iframe id="frame" src="../index.html?test=1&revision=3"></iframe>
<script>
const frame=document.getElementById('frame'),status=document.getElementById('status'),report=document.getElementById('report');
const wait=()=>new Promise(r=>setTimeout(r,220));frame.onload=()=>status.textContent='游戏已载入';
function quiet(item='sword'){const r=new frame.contentWindow.XJ.Run(42,item,'standard');r.spawnTimer=r.eliteAt=r.bossAt=r.eventAt=1e8;return r;}
function render(r){if(!frame.contentDocument.getElementById('overlay').hidden)frame.contentDocument.getElementById('bookClose')?.click();frame.contentWindow.xuanjian.test.setRun(r);return frame.contentDocument;}
function upgrade(){const r=quiet();r.skills={gate:2,light:1,rain:2,peril:2};r.level=8;r.openChoice();r.choices=['gate','rain','peril'];render(r);return r;}
function screen(){const r=quiet('screen');r.skills={spring:1,gate:1};r.openChoice();r.choices=['spring','edict','flame'];render(r);return r;}
function crowd(){const w=frame.contentWindow,r=quiet();r.skills=Object.fromEntries(w.XJ.SKILLS.map(s=>[s.id,3]));r.t=110;r.p.x=1600;r.p.y=1100;r.setPrimary('gate');r.setManual('rain');for(let i=0;i<55;i++){const a=i*2.4,e=r.spawn(i%13===6?0:i%13,i%11===0,r.p.x+Math.cos(a)*(130+i*6),r.p.y+Math.sin(a)*(130+i*6));if(e)e.born=0;}r.zones.add({kind:'dusk',x:r.p.x,y:r.p.y,r:256,life:7,age:1,tick:0,playerWound:12,wounds:new Map()});r.zones.add({kind:'hazard',x:r.p.x+130,y:r.p.y,r:55,life:3,age:.5,warn:1.5,tick:0,damage:10});r.updateSkills(.01,r.nearest());r.step=()=>{};render(r);return r;}
function finish(){const r=quiet();r.skills={gate:3,light:1};r.gift='life';r.life=6;r.t=122;r.kills=120;r.p.hp=3;r.hurt(30,false,{name:'冲锋者',kind:'charge'});if(r.state!=='ended')r.end('身死道消');render(r);return r;}
document.getElementById('gift').onclick=()=>{const r=quiet();r.state='choice';r.choiceKind='gift';r.choices=frame.contentWindow.XJ.GIFTS.map(g=>g.id);render(r);};document.getElementById('upgrade').onclick=upgrade;document.getElementById('screen').onclick=screen;document.getElementById('crowd').onclick=crowd;document.getElementById('finish').onclick=finish;
document.getElementById('checks').onclick=async()=>{const checks=[],w=frame.contentWindow;const check=(name,value)=>{checks.push({name,pass:!!value});};try{
let r=upgrade(),d=frame.contentDocument;check('三张卡有独立选择按钮',d.querySelectorAll('.decision-card .choose-card').length===3);check('默认没有展开大段详情',!d.querySelector('.decision-details[open]'));check('三重展示实际新机制',d.getElementById('panel').textContent.includes('新增持续收束')&&d.getElementById('panel').textContent.includes('新增随身缓移'));const before=JSON.stringify(r.skills);d.querySelector('.decision-details summary').click();await wait();check('展开详情不选择卡、不推进时间',JSON.stringify(r.skills)===before&&r.state==='choice'&&r.t===0);check('完整描述可访问',d.querySelector('.decision-details').open);d.querySelector('[data-choice="0"]').click();await wait();check('按钮真实修至三重',r.lv('gate')===3);check('升级反馈来自实际已选能力',r.message.includes('谒天门')&&r.message.includes('三重'));r.pause();w.xuanjian.test.sync();check('暂停主修选择可见',!!d.getElementById('primarySelect'));d.getElementById('primarySelect').value='gate';d.getElementById('primarySelect').dispatchEvent(new Event('change'));check('主修通过DOM实际生效',r.primarySkill==='gate');d.getElementById('manualSelect').value='gate';d.getElementById('manualSelect').dispatchEvent(new Event('change'));check('手动仍清除同一道主修',r.manualSkill==='gate'&&r.primarySkill===null);
r=screen();d=frame.contentDocument;check('持屏无效强化提示可见',d.querySelector('.fit-note').textContent.includes('强化暂无收益'));r=crowd();w.xuanjian.test.sync();check('密集能力栏限四道且可打开完整谱',d.querySelectorAll('#skillChips .skill-live').length===4&&d.getElementById('skillChips').textContent.includes('全部 19 法'));d.querySelector('[data-open-book]').click();check('技能栏入口真实暂停并开神通谱',r.state==='paused'&&d.getElementById('panel').textContent.includes('神通谱'));
r=quiet();r.skills.dusk=1;render(r);d=frame.contentDocument;const mp=r.p.mp;d.getElementById('blinkAction').click();check('域外点击挪移解释原因且不扣蓝',r.message.includes('血漠')&&r.p.mp===mp);r.zones.add({kind:'dusk',x:r.p.x,y:r.p.y,r:250,age:0,life:6,playerWound:0,wounds:new Map()});w.xuanjian.test.sync();d.getElementById('blinkAction').click();check('域内点击挪移实际扣八法力',r.telemetry.blinkUses===1&&r.p.mp===mp-8);
r.p.guard=3;w.xuanjian.test.sync();check('地面抵挡次数可见',d.getElementById('resources').textContent.includes('地面抵挡 3 次'));r=finish();d=frame.contentDocument;check('结算详情保留施法记录',!!d.querySelector('#panel details .casting-summary'));check('结算显示真实死亡原因',d.getElementById('panel').textContent.includes('冲锋者'));check('再开一局入口可用',!!d.getElementById('quickRestart'));d.getElementById('quickRestart').click();await wait();check('重开走正常起手且清空本局能力',w.xuanjian.run.state==='choice'&&w.xuanjian.run.choiceKind==='opening'&&Object.keys(w.xuanjian.run.skills).length===0);
}catch(e){checks.push({name:'unexpected exception',pass:false,error:e.stack});}const result={suite:'constructed DOM actions, not normal play',passed:checks.filter(c=>c.pass).length,total:checks.length,checks};report.textContent=JSON.stringify(result,null,2);status.textContent=result.passed+'/'+result.total;};
</script>
