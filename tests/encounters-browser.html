<!doctype html><meta charset="utf-8"><title>山场机缘 · 构造验收</title>
<style>body{margin:0;background:#eee9dd;color:#284b40;font:14px system-ui}header{padding:6px}button{padding:7px;margin:2px}iframe{display:block;width:100%;height:calc(100vh - 110px);border:0}pre{white-space:pre-wrap;max-height:170px;overflow:auto}</style>
<header>构造检查 · 状态由测试按钮设定，非正常试玩；战斗仅在“推进”时运行。<br>
<button data-scene="cache">行囊</button><button data-scene="hold">据守</button><button data-scene="chase">追击</button><button id="inside">进入圈内</button><button id="outside">离圈</button><button id="advance">推进 1 秒</button><button id="complete">推进 11 秒</button><button id="kill">击破旗记目标</button><button id="victory">胜利结算</button><button id="narrow">窄屏 390</button><button id="wide">桌面 1280</button><button id="check">运行回归</button><span id="status">载入中</span><details><summary>回归结果</summary><pre id="report"></pre></details></header>
<iframe id="frame" src="../index.html?test=1&revision=015"></iframe>
<script>
const f=document.getElementById('frame');let r,step;
f.onload=()=>document.getElementById('status').textContent='已载入';
function sync(){f.contentWindow.xuanjian.test.sync();}
function scene(kind){const w=f.contentWindow;r=new w.XJ.Run(42,'sword','standard');r.autoItem=false;r.cool.attack=1e8;r.spawnTimer=r.eliteAt=r.bossAt=1e8;r.t=w.XJ.FieldEvent.schedule.find(s=>s.kind===kind).at;r.updateFieldEvent();step=r.step.bind(r);r.step=()=>{};w.xuanjian.test.setRun(r);return r;}
function enter(){r.p.x=r.fieldEvent.x;r.p.y=r.fieldEvent.y;r.updateFieldEvent();sync();}
function leave(){r.p.x=r.fieldEvent.x+240;r.updateFieldEvent();sync();}
function advance(seconds){for(let i=0;i<seconds*20;i++)step(.05);sync();}
function kill(){for(const q of r.enemies.list().filter(q=>q.fieldGuard)){q.born=0;r.hit(q,1e6);}r.nextChoice();sync();}
function victory(){scene('hold');r.skills={gate:3,light:1};r.gift='life';r.life=5;r.t=725;r.end('破阵功成');sync();}
document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>scene(b.dataset.scene));const resumeFixture=()=>{if(r?.state==='paused')r.pause();};document.getElementById('inside').onclick=()=>{resumeFixture();enter();};document.getElementById('outside').onclick=()=>{resumeFixture();leave();};document.getElementById('advance').onclick=()=>{resumeFixture();advance(1);};document.getElementById('complete').onclick=()=>{resumeFixture();advance(11);};document.getElementById('narrow').onclick=()=>{f.style.width='390px';f.style.height='844px';};document.getElementById('wide').onclick=()=>{f.style.width='1280px';f.style.height='800px';};document.getElementById('kill').onclick=kill;document.getElementById('victory').onclick=victory;
document.getElementById('check').onclick=async()=>{const checks=[],check=(name,value)=>checks.push({name,pass:!!value});const wait=()=>new Promise(resolve=>setTimeout(resolve,220));try{
scene('cache');let d=f.contentDocument;check('HUD给出行囊任务与奖励',d.getElementById('fieldEvent').textContent.includes('连续停留 2 秒')&&d.getElementById('fieldEvent').textContent.includes('参悟选择'));enter();advance(1);check('拾取进度可见且真实推进',r.fieldEvent.progress>.9&&d.querySelector('.encounter-track i').style.width!=='0%');leave();check('离圈清空拾取进度',r.fieldEvent.progress===0);enter();advance(2.1);check('完成进入原有选卡并标出来源',r.state==='choice'&&d.getElementById('panel').textContent.includes('散落行囊 · 参悟'));const t=r.t;advance(2);check('选卡冻结战斗和机缘时钟',r.t===t);d.querySelector('[data-choice="0"]').click();await wait();check('选择按钮真实获得能力且不重复奖励',r.log.filter(x=>x.type==='event').length===1&&r.pending.length===0);
scene('hold');enter();advance(2);leave();const progress=r.fieldEvent.progress;advance(1);check('离圈保留据守进度并说明原因',r.fieldEvent.progress===progress&&d.getElementById('fieldEvent').textContent.includes('离圈暂歇'));d.getElementById('pause').click();check('暂停可查目标与放弃入口',r.state==='paused'&&!!d.getElementById('abandonEvent'));d.getElementById('abandonEvent').click();check('暂停放弃不扣资源不发奖励',r.fieldEvent.status==='abandoned'&&r.rerolls===0&&r.pending.length===0);
scene('chase');enter();check('追击HUD与旗记目标对应',d.getElementById('fieldEvent').textContent.includes('追击旗记目标')&&r.enemies.list().some(q=>q.fieldCourier));kill();check('追击奖励进入选卡',r.state==='choice'&&r.xp===8&&d.getElementById('panel').textContent.includes('截下携物敌修 · 参悟'));
victory();check('胜利页解释保留与资源规则',d.getElementById('panel').textContent.includes('不额外补满资源'));d.getElementById('continueEndless').click();check('续无尽按钮实际保留修习与寿元',r.mode==='endless'&&r.lv('gate')===3&&r.life===5&&r.state==='running');check('竭命就绪标记正确',d.getElementById('lifeAction').classList.contains('action-ready'));d.getElementById('lifeAction').click();sync();check('竭命点击实际耗寿并显示持续增伤',r.life===4&&d.getElementById('lifeAction').textContent.includes('增伤 85%')&&d.getElementById('lifeAction').classList.contains('action-active'));check('器物按钮无模板残字符',!d.getElementById('itemAction').textContent.includes('}'));
}catch(e){checks.push({name:'unexpected exception',pass:false,error:e.stack});}const result={suite:'constructed browser DOM actions, not normal play',passed:checks.filter(c=>c.pass).length,total:checks.length,checks};document.getElementById('report').textContent=JSON.stringify(result,null,2);document.getElementById('status').textContent=result.passed+'/'+result.total;};
</script>
