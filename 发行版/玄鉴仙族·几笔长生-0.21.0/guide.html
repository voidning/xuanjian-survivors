<script>/* Generated from docs/原作设定与游戏表现对照.md. */
window.XJGuideHTML="<h1>原作设定与游戏表现对照</h1><p>版本：0.21.0 · 通用瞬移</p><p>当前实装十九道神通、五件器物、六种箓气、两个果位。这里集中保留详细数值、原作借鉴与改编边界；开局只需看器物和卡片的用途，操作另见「操作说明」。</p><p>原作事实沿用项目现有原著依据资料；本次果位改动沿用前轮已读全文的《六合》《贪罟玄离（2）》《求金》《渌缺》依据，出处与边界见「0.17.0-果位同参」；其余内容未重新逐章核验，不扩写未确认的能力。原作分类未确认时留空，不按名称猜测。S／A／B 为游戏强度定位，一至三重为局内修习等级，均不是原著境界。</p><h2>果位</h2><h3>明阳果位</h3><p>原作借鉴：明阳有五道同参；原作登位不只是收集五道神通。</p><p>明阳成型解锁唯一 F 蓄能主动槽，首次满能100；原手动神通恢复自动。附近650范围有已入场敌人或敌弹时每秒+2.5能量，普通击杀+0.15、精英+4、首领+8，每次释放后击杀累计最多补12。满能可保留，暂停、参悟、死亡及脱战不按时间蓄能。满能按F或点击按钮，在施放点于0、0.6、1.2秒发出三次六合敕令，半径为普通天下明×1.2；每次伤害22/30/38、禁闭1.6/2/2.4秒并忽略减伤，消除范围内敌弹。消耗全部能量，不耗法力；不清地面危险、不反弹、不无敌、不召仙将。普通天下明仍是单次施放，26法力、8秒冷却；果位的原有令域、甲兵与挪移联动保留。</p><p>原著《六合》明确六合之光可敕令禁闭、消解恶难。本作映射为禁闭敌人与消除敌方飞弹；三次节拍、范围倍率、伤害、时长及果位解锁均为游戏改编，不是原著登位流程。不会清除地面危险、不反弹飞弹，也不增加无敌。</p><h3>渌水果位</h3><p>原作借鉴：洞泉声、如重浊、丑癸藏、清夕雨、洗劫露属于这一组渌水同参。</p><p>游戏效果：洞泉声、如重浊、丑癸藏、清夕雨、洗劫露各至少一重，且其中任意一道三重时激活。保留低重清夕雨跟随、洞泉声额外一次助击、丑癸藏附带 1 秒地面护行；所有清夕雨半径 ×1.25、持续 ×1.35、每跳伤害 ×1.5，仍每 0.55 秒一跳、耗 22 法力、冷却 9 秒。敌人连续在果位雨域受雨 2 秒后护持失效，持续受雨刷新，离雨后延续 3 秒。三重清夕雨选点与跟随、三重洞泉声额外两击均保留，三重清夕雨全额叠加果位收益。可与明阳同时激活。</p><p>改编边界：同参门槛、雨势数值和将磨阵映射为护持失效均为游戏改编；不改变重甲固有减伤，不消除神通或飞弹，不恢复天下覆，不宣称还原果位完整权柄。</p><h2>神通</h2><h3>谒天门</h3><p>原作类别：术神通。</p><p>原作借鉴：可召金甲甲兵，六合之光能增益甲兵的神智与战力。</p><p>游戏效果：26 法力，9 秒冷却。每次 2/3/4 名，存在 8/9/10 秒，攻击 18/24/30。天下明令当前甲兵 5 秒内攻击间隔 0.8→0.45 秒、伤害 ×1.6，并绕过减伤。</p><p>改编边界：本作取召兵支脉；未完整实现天门镇压、引火及消磨异种法力。甲兵总数上限 8，兵数足时暂缓施放。</p><h3>君蹈危</h3><p>原作类别：身神通。</p><p>原作借鉴：合围强敌越多、处境越危，加持越强；脱围后此战伤势愈合更快。较善承受累积纠缠伤，爆发重创仍是不利处。</p><p>游戏效果：被至少两名近敌围住时按人数和精英/首领权重加强。最高伤害 +20/25/30%；小额伤害最多减 12.5/15/17.5%，重击最多减 3.5/4.5/5.5%。脱围 1 秒后每秒恢复 3/4/5 气血，仅可恢复本次合围实际受伤的 28/36/44%，储量上限 45。</p><p>改编边界：人数、比例和脱围距离 170 都是改编；未模拟白麟命数与迷惑术。疗伤不回寿元。</p><h3>帝观元</h3><p>原作类别：术神通。</p><p>原作借鉴：取明阳统御、协调诸法的性质。</p><p>游戏效果：14 法力，8 秒冷却，前方令域存在 5.5 秒，半径 135/160/185。普攻向受令目标出手时追加 16/22/28 忽略减伤的打击，并将过远甲兵拉向令域。 持重明洞玄屏时不触发普攻追加打击，仍可召回甲兵、计入明阳果位。</p><p>改编边界：令旗形态、普攻标记和甲兵集结是协同改编，不能等同于原著完整帝权、臣制。</p><h3>赤断镞</h3><p>原作类别：术神通。</p><p>原作借鉴：血漠记去部分杀伤；离开时可将这部分留在漠中。域内疗愈也可被窃去一分。它不是封死退路的囚禁之境，所延伸之处可挪移。</p><p>游戏效果：20 法力，10 秒冷却。半径 212/234/256，存在 6/6.5/7 秒；记录自身在域内实际掉血的 24/30/36%，离域或收术时返还。敌人在域内受伤亦同样记录和返还。E 耗 8 法力，冷却 2.8 秒，在域内沿最近移动方向挪移最多 180，短暂无敌 0.45 秒。</p><p>改编边界：致死伤不救命；未实现窃疗、阳极逆位秘术减耗和复杂开合变化。不把“可”解释成原著强制为所有敌人疗伤，敌我统一结算是当前简化。</p><h3>天下明</h3><p>原作类别：命神通。</p><p>原作借鉴：六合光有敕令禁闭、消解恶难之用，与谒天门甲兵响应。</p><p>明阳成型解锁唯一 F 蓄能主动槽，首次满能100；原手动神通恢复自动。附近650范围有已入场敌人或敌弹时每秒+2.5能量，普通击杀+0.15、精英+4、首领+8，每次释放后击杀累计最多补12。满能可保留，暂停、参悟、死亡及脱战不按时间蓄能。满能按F或点击按钮，在施放点于0、0.6、1.2秒发出三次六合敕令，半径为普通天下明×1.2；每次伤害22/30/38、禁闭1.6/2/2.4秒并忽略减伤，消除范围内敌弹。消耗全部能量，不耗法力；不清地面危险、不反弹、不无敌、不召仙将。普通天下明仍是单次施放，26法力、8秒冷却；果位的原有令域、甲兵与挪移联动保留。</p><p>改编边界：没有甲兵时仍能控场消弹；后续新召甲兵不继承这次强化。没有模拟对修士命数权势的完整控制。</p><h3>清夕雨</h3><p>原作借鉴：渌水神通；青雨连续压在敌方阵法上，使其最终动摇。</p><p>游戏效果：22 法力，9 秒冷却；半径 130/150/170，持续 4.5/5/5.5 秒，每 0.55 秒对域内各敌人造成 9/12/15 伤害；降雨 0.8 秒后施加 0.8 秒护持失效。激活渌水果位后，半径 ×1.25、持续 ×1.35、每跳伤害 ×1.5；连续受果位雨 2 秒后，护持失效持续刷新并延续至离雨 3 秒，不改变重甲固有减伤、不消除神通或飞弹。 自动选点优先覆盖施法范围内的密集敌群。 三重优先落在险地，随后随自身缓移。</p><p>改编边界：取雨势持续磨阵。把阵法对应为敌方护持是游戏类比；没有凭水名加入冻结，也未实现渌水/牝水闰法。</p><h3>洞泉声</h3><p>原作类别：命、身兼具。</p><p>原作借鉴：兼有身神通与命神通性质，能辅助自身攻势，使攻击难以抵御。</p><p>游戏效果：22 法力，7 秒冷却；接下来四次普攻附加 18/26/34 伤害并额外贯穿一名敌人，泉势保留 8 秒。三重额外增加两次助击，渌水果位额外增加一次，因此一、二重为四击（果位五击），三重六击（果位七击）。 持重明洞玄屏时助击停用且不耗法力，仍计入渌水果位；强化没有持屏助击收益。</p><p>改编边界：取助长自身攻势的表现；四次普攻、贯穿与数值为战斗改编，未实现探察心念和命数。</p><h3>如重浊</h3><p>原作借鉴：能惑乱人心、影响心智。</p><p>游戏效果：20 法力，9 秒冷却；在 450 内密集敌群处释放半径 110/130/150 浊光，普通敌人惑乱 1.8/2.2/2.6 秒，精英与首领时间减半；打断当前蓄势与冲锋，受影响者远离玩家移动。</p><p>改编边界：方向错乱与打断是惑心的游戏化表达，不模拟长期支配，不让敌人永久成为召唤物。</p><h3>丑癸藏</h3><p>原作借鉴：具有藏匿自身及法力的性质，也存在被其他神通识破的边界。</p><p>游戏效果：18 法力，10 秒冷却；有敌进入 230 范围才施放，藏匿 2/2.5/3 秒。敌人追向施法时留下的位置，期间不新发起瞄准攻击；已开始的冲锋、飞弹、地面危险与接触仍会伤人。</p><p>改编边界：留下旧位置与攻击判定是局内抽象，不是绝对隐身或无敌。自动攻击不会提前解除这段藏匿。</p><h3>洗劫露</h3><p>原作借鉴：有消灾去劫、化身如水波、穿过镇压与封锁的性质。</p><p>游戏效果：22 法力，9 秒冷却；遇迟缓或附近地面危险才施放，清除半径 140/170/200 内相交的地面法区及自身迟缓，随后 2/2.5/3 秒免受地面伤害。</p><p>改编边界：限定为地面解困，不免疫飞弹、冲锋或接触伤害，不回复气血、法力或寿元；未模拟天地人三劫。</p><h3>靖平敕</h3><p>原作借鉴：玄雷的荡清神通，距离越近威能越大；受围逼近时荡开敌人，以便抽身。</p><p>游戏效果：28 法力，8 秒冷却；有敌人进入 175 范围时发动。半径 240/265/290，伤害随距离由 36/50/64 增至最高 72/100/128；越近震退越远，并打断蓄势与冲锋。</p><p>改编边界：只取近强远弱和荡清表现。控制首领、具体距离与冷却是游戏规则；不照搬苗氏邪雷的全部性质。</p><h3>镂金石</h3><p>原作借鉴：庚金身神通；已见其气破阵、损毁法器、以点破面的作用，并以杀敌血气淬炼而增强。</p><p>游戏效果：普攻额外伤害 6/9/12、额外穿透 1/2/3 敌，令目标护持失效 3 秒；学会后每五次击杀淬炼一层，每层再加 2 伤害，最多六层。杜若枪的普通突刺同样获得增伤、穿透与破护。</p><p>改编边界：伤害、穿透、淬炼上限均为改编，淬炼只在本局保留。不毁掉真实装备，未实现服金疗伤等更多性质。</p><h3>天金胄</h3><p>原作借鉴：庚金凝甲护体的能力；仙基阶段已见金胄着体、增强肉身与抵御的描述，亦有修成同名神通的叙述。</p><p>游戏效果：遇敌时耗 20 法力凝甲，冷却 11 秒、持续 7 秒，吸收 38/52/66 伤害。剩余甲量高于 12 且持续时间超过 1 秒时，不重复施放。</p><p>改编边界：本作只取凝甲承伤，未模拟金石疗伤、断肢修复或绝对水火免疫。完全由甲量吸收的攻击不会触发长空危雀。</p><h3>雉离行</h3><p>原作借鉴：已明确的仙基表现是驾驭雉离真火、吐焰与化鸟驰炎踏火。</p><p>游戏效果：18 法力，7 秒冷却；近敌进入焰流范围后，吐出随自身移动并缓慢转向敌人的扇形火焰，范围 175/195/215，持续 1.7/2/2.3 秒；每 0.25 秒伤害 7/9/11，吐焰时移动 +15%。</p><p>改编边界：以已明确的仙基作用改编为游戏技能，统一列入神通池，不宣称已经还原紫府层面的全部能力。保留火柴人主体，以翼状焰迹表现炎行。</p><h3>溪上翁</h3><p>原作类别：命神通。</p><p>原作借鉴：萧初庭所修的坎水命神通，具有勾动贪嗔、幻化诱人之物使人入局的性质。中术者可被打醒；也有垂钓引出妖邪的表现。</p><p>游戏效果：26 法力，10 秒冷却。在 430 内选敌群落下幻饵，诱引半径 150/170/190 内最多 24 名已入场敌人，打断其当前蓄势或冲锋并使其走向幻饵。普通敌人最长受诱引 3.5/4/4.5 秒；精英时长乘 0.55，首领乘 0.25。每次实际受到伤害再缩短 0.25 秒。幻饵不造成伤害，接触敌人仍会受伤。</p><p>改编边界：诱引目标数、选点、时长、打断、受击缩时及首领抗性均为游戏改编。没有将贪嗔诱引写成物理吸力；不控制敌人为玩家攻击，不额外生成经验，也不模拟长期算计命数。</p><h3>位从险</h3><p>原作类别：命神通。</p><p>原作借鉴：萧初庭所修的坎水命神通。斗法中显化山川险势、束缚与收束对手位置，使其陷险；求道时又有借险势发挥神通的表现。</p><p>游戏效果：28 法力，11 秒冷却。在 430 内选敌群展开半径 140/160/180 的险地，持续 3.2/3.8/4.4 秒；附近有尚在生效且有敌人的幻饵时，优先与其重合。展开瞬间将范围内敌人向中心收近最多 60/80/100，保留中心 20 距离，短暂停住 0.55/0.75/0.95 秒；精英收束距离与停顿乘 0.55，首领乘 0.2。域内敌人的普通移动降至 35%，离域后很快恢复；已启动的冲锋不因迟缓而减速。险地不直接伤害敌人。 三重在域内持续缓慢收束；精英与首领牵引较弱。</p><p>改编边界：只取山川险势中的收束、束缚表现。圆形区域、距离、迟缓、首领抗性和与幻饵的选点协同是游戏设计；不模拟全部命数与求金权柄，不凭“险”字增加斩杀、吸血或无条件增伤。</p><h3>香俱沉</h3><p>原作借鉴：白色流苏腾起阴火，以火焰成术；周围雨水化雾。</p><p>游戏效果：选定附近敌群，留下3.2秒阴火区域；24法力、10秒冷却，随等级每0.55秒造成10/13/16伤害，半径125/140/155。</p><p>改编边界：只取阴火灼伤，不添加冻结、治疗、清除危险预警。</p><p>出处：第753章《活计》。</p><h3>大离书</h3><p>原作类别：术神通。</p><p>原作借鉴：离火术神通，别名望日述；生出杏黄、琥珀边缘的南明心火，能焚化，并有离火常随和行走增益。</p><p>游戏效果：26 法力，冷却 9 秒；唤起随身南明心火 4 秒，每 0.5 秒灼伤近敌。三重分别为范围 85/100/115、每跳 13/17/21 伤害；生效时移动 +12%。不消弹、不免伤，不附带大离白熙光。</p><p>改编边界：仅实现心火焚敌与行走增益；心府纳器、长期养火、辅助炼器未实现。不附带大离白熙光、吞器回蓝、吸血、复活、冻结或无敌。</p><p>出处：第1139章《昶离》。</p><h3>至命除</h3><p>原作类别：命神通。</p><p>原作借鉴：《圣命》《命除》明确写到夺取天星火葫、夺除兼险夺、合并天星与天乌并火；命中公羊英、颜见霄时命神通短暂失效。</p><p>游戏效果：30 法力，冷却 12 秒；并火加持 4 秒，每秒向 280 内一名近敌发出灰焰重击，优先法术敌人。每击 24/30/36 伤害；打断并封住布阵、护持、召援、封路与光幡能力 0.6/0.8/1 秒，精英减半。敌人仍可移动；不清除已生成的弹道、危险或召物。</p><p>改编边界：敌方布阵、护持、召援、封路、光幡只是本作法术能力映射，不称其为原著命神通。没有夺火夺器系统，不实现万能偷技、吸血、治疗、全弹反射、白蝉化身；封闭天地属于帝观元配合，不移植。</p><p>出处：第1519章《圣命》；以用户提供正文核对；《命除》；不同站点编号有差异，以章名与用户正文为准。</p><h2>器物</h2><h3>青尺剑</h3><p>原作借鉴：用剑弧挡来袭青芒、出剑攻敌，遗留剑意另有所属。</p><p>游戏效果：免费剑光，近身附横扫；G耗 16 法力，5 秒冷却，周身斩击并消当前敌弹。主动要求敌人位于近处。 默认按战况自动施放，R 切换手动；自动施放保留 12 法力，G仍可主动使用。</p><p>改编边界：没有把全部遗留剑意当作普通用器；主动触发范围为 180，减少远处有敌却空扫。</p><h3>青乌弓</h3><p>原作借鉴：灌法力使箭附锐气，李项平所持法器。</p><p>游戏效果：免费远程普射；G耗 22 法力，4 秒冷却，直线贯穿锐箭。 默认按战况自动施放，R 切换手动；自动施放保留 12 法力，G仍可主动使用。</p><p>改编边界：贯穿数、弹速、射程为改编，无自动追踪。</p><h3>杜若枪</h3><p>原作借鉴：李清虹所持银枪，能够承载她灌入的雷电之力；枪身与枪尖有受损、修复的表现。</p><p>游戏效果：普攻每 0.6 秒沿近敌方向突刺，长度 235、基础伤害 26，最多两敌；洞泉声加持时伤害增加并多穿一敌。武器技耗 22 法力、冷却 5 秒，直线 340 内造成 64 伤害，忽略减伤、震退并打断敌人攻势，停顿 0.65 秒。最多命中 24 敌。</p><p>改编边界：长度、伤害、贯穿、震退与打断均为本作改编；雷光来自灌入枪身的雷法，不将李清虹全部雷法或六雷玄罚令归为杜若枪本身的能力。</p><h3>六雷玄罚令</h3><p>原作借鉴：六枚银令合用，引银雷自上而下击敌。</p><p>游戏效果：自动单体落雷18伤害、0.72秒间隔；主动30法力、8秒冷却，430范围至多6敌各65伤害。</p><p>改编边界：连发与六目标是游戏节奏设计；无器物固有破甲、眩晕，不挪用同场长枪的贯穿能力。</p><p>出处：第602章《玄罚》。</p><h3>重明洞玄屏</h3><p>原作借鉴：八扇画屏垂暗青法光，将金毫与两道金刀停在半空。</p><p>游戏效果：无伤害普攻；每1.5秒可将110内金属飞弹停0.6秒。主动24法力、8秒冷却，展开170范围、4秒停金区域；结束后飞弹恢复。 持屏不提供镂金石候选。洞泉声助击停用且不耗法力，仅计入渌水果位；帝观元仍可召回甲兵，但不触发普攻追加打击。</p><p>改编边界：仅拦金属飞弹，不拦接触、冲刺、地面危险或所有法术。该器物开局只提供攻击/召兵神通，避免选到纯加持后无法杀敌。</p><p>出处：第727章《镗金之战》。</p><h2>箓气</h2><h3>重海长鲸</h3><p>原作借鉴：偏向法力容量与回复。</p><p>游戏效果：法力上限 100→160，基础回复 7→13/秒；不回血。 上述为基础回法；另计通用局内升级奖励，每级 +0.3／秒、最多 +5／秒。</p><p>改编边界：容量与回复量为游戏数值；单角色受箓资格为本局前提。</p><h3>竭命功成</h3><p>原作借鉴：以寿命代价换法力与短时爆发。</p><p>游戏效果：Q：消耗不可治疗补回的一格寿元，回复 80 法力，6 秒伤害 ×1.85，12 秒冷却；每局八格。</p><p>改编边界：格数、比例均为抽象，寿元耗尽仅禁用 Q；普通治疗不能消除代价。</p><h3>长空危雀</h3><p>原作借鉴：行气灵巧、腾挪跌宕，见血则悍勇，引血气加持，善斗法驾风。</p><p>游戏效果：平时移动 +6%；实际被敌伤血时触发 5 秒悍勇，移动改为 +20%、伤害 +25%，重复受伤只刷新。</p><p>改编边界：原文见血的范围更宽；以自身实际受伤触发是清晰可读的游戏条件。盾甲挡掉全部伤害不触发；不吸血、不回寿元。</p><h3>明彰日月</h3><p>原作借鉴：有扫清魔障、继业承平的性质；生死争斗中攻破神通、挫败魔释，能引动升阳法力、增长道行。</p><p>游戏效果：击败精英回复 45 法力并直接获得 18 额外经验；击败首领回复 90 法力并直接获得 45 额外经验。与原有精英、首领奖励叠加，不消耗寿元。</p><p>改编边界：将破敌得法、得道行缩为精英或首领击杀触发；经验不等于原著道行。敌人是本作设计的战斗单位，不据此认定全部属于原著魔释。不自动补齐同参、不自动提高神通等级，也不提供平时额外回法。</p><h3>行气吞灵</h3><p>原作借鉴：受箓者能拿云气、驱灵雾、腾云驾雾；原文另有服气修行作用。</p><p>游戏效果：取驾雾支脉，移动速度提高14%。</p><p>改编边界：百分比为游戏数值；不将长期服气改成即时法力回复，不提供无敌、穿墙或免疫。</p><p>出处：第264章《杀妖受箓（二合一）》。</p><h3>谷风引火</h3><p>原作借鉴：李曦明凭箓气精炼真元、善控火焰，可同时操控两座丹炉。</p><p>游戏效果：仅令现有雉离行追踪转向从1.5提高至5弧度/秒。</p><p>改编边界：控火灵活性是窄范围游戏映射；不增伤、不减耗、不增强雷术；未学雉离行时暂无战斗收益。</p><p>出处：第829章《解惑》。</p><h2>未接入的内容</h2><p>当前只有明阳、渌水两种果位。独立神通不自动组成其他果位。大离书（别名望日述）与至命除均已可选，未设置离火或并火果位。其他尚未核实的能力不作为当前配方；本次不扩充其设定。</p><h2>当前游戏规则</h2><h2>开始一局</h2><p>双击「启动游戏.command」，在首页选择器物，再选一道起手神通。用 WASD／方向键移动，或点击地面前往；攻击自动进行，靠近拾取经验，升级时停下来三选一。</p><p>共有五件器物：青尺剑、青乌弓、杜若枪、六雷玄罚令、重明洞玄屏。持屏没有伤害普攻，依靠攻击或召兵神通杀敌，适合熟悉神通后尝试。</p><p>默认「十二分钟 · 破阵挑战」：撑到十二分钟，击败终阵即可胜利结算；普通首领被击败后仍继续。胜利后可以保留修为继续无尽，也可开局选择无尽模式。</p><h2>常用操作</h2><ul><li>移动：WASD／方向键或点击地面；键盘移动会取消点击目标。</li><li>选择：点击卡片下方选择按钮或按 1／2／3；受箓可按 1—6。</li><li>器物技：G主动使用；R 切换自动／手动，默认自动。</li><li>暂停：P／Esc；可设主修、指定手动神通、调整体验设置或结束本局。</li><li>神通谱：Tab；查阅期间暂停。M 开关音效。</li></ul><p>学到相关能力后再用：E 在自己的血漠内挪移，需赤断镞、8 法力并等待 2.8 秒冷却；Q 发动竭命功成，每次消耗一格不可治疗补回的寿元；F 施放暂停菜单指定的主动神通。</p><p>普通攻击不耗法力。普通神通共用法力（蓄能六合敕令只耗能量），必须满足目标、冷却和触发条件；神通栏显示生效、冷却或等待原因。器物自动施放会为等待的神通留法，并保留 12 法力余量。寿元只在主动按 Q 时消耗。</p><h2>选卡与修行路线</h2><p>新神通增加一种能力，强化已有神通提升至二重、三重。每次参悟回复 20 法力；修行等级提高后，法力回复每级增加 0.3／秒，额外最多 5／秒。</p><ul><li>明阳：谒天门、君蹈危、帝观元、赤断镞、天下明。甲兵协战与近身控场。</li><li>渌水：洞泉声、如重浊、丑癸藏、清夕雨、洗劫露。助击、惑敌、藏匿与磨阵。</li></ul><p>每组五道同参各至少一重，且其中任意一道达到三重，才激活对应果位；最低需要七次神通投入（含起手），修行强化不计入。两组可同时成型，没有神通槽位限制。其余九道独立神通可自由搭配，不计入当前果位。</p><p>已开始的果位连续三次成长候选落空后，后续候选优先补一个缺少的同参；五道齐备但尚无三重时，同一保底改为提供一道未满三重的同参精修机会。多个路线同时满足时，按落空次数、已学同参数量依次优先，一次保障一条路线。相应候选一出现即重置该路线计数，不要求选中；重抽不更新计数，并优先换掉上一组候选。机缘限定道统时仍受候选池约束，不保证拿到特定一道。击败精英或首领可获得重抽，首次击败可触发一次受箓；每局一种箓气，选定不更换。</p><p>S／A／B 是游戏强度定位；一至三重是本局修习等级；命、身、术是原著类别。三者不同，字母评级不代表当前最值得选。</p><h2>主修与搭配限制</h2><p>在暂停菜单指定一道主修：就绪时优先施放，缺法力先蓄法；冷却、无目标或效果尚在时让其他神通施放，紧急防御仍优先。选择「均衡调度」恢复自动安排。同一道神通不能同时设为主修和 F 手动；君蹈危、镂金石为被动。</p><p>持重明洞玄屏时，镂金石不进入候选；洞泉声助击停用且不耗法力，仍计入渌水果位，强化没有持屏助击收益。帝观元仍可召回甲兵，但不触发普攻追加打击。谷风引火只改善雉离行转向，未学雉离行时暂无战斗收益。</p><p>三重洞泉声增加两次助击；三重清夕雨优先落在险地，随后随自身缓移；三重位从险持续缓慢收束。天下明只强化当时在场的甲兵，之后新召的甲兵不继承这次加持。这些联动无需额外按键。</p><h2>看清危险，寻找空隙</h2><p>先避开冲锋路径、飞弹和敌方地面危险。喘息阶段停止补充普通敌群，适合收取经验；残敌、精英和首领仍在行动。神通谱的「敌情」可查看招式与应对。</p><p>赤断镞的血漠记录域内实际战伤，离域或收术时返还；敌人也会返还所记伤势，它不是单纯的伤害光环。域内可以按 E 挪移，致死伤不能靠返还救命。</p><p>丑癸藏改变敌人追踪的位置，已发出的攻击仍危险；洗劫露只提供地面解困和短时地面护行，不免疫飞弹或接触；重明洞玄屏只暂留金属飞弹，结束后仍会恢复。</p><h2>山场机缘</h2><p>同一时间只出现一处机缘。看右上角的方向、距离、目标与奖励，再决定是否前往。没有机缘也可正常杀敌、拾取经验升级；不设强制任务。</p><table><thead><tr><th>机缘</th><th>完成方式</th><th>奖励</th></tr></thead><tbody><tr><td>散落行囊</td><td>圈内连续停留 2 秒；离圈清空拾取进度</td><td>参悟选择一次</td></tr><tr><td>据地御敌</td><td>圈内累计守住 10 秒；离圈保留进度，附近有额外增援</td><td>参悟选择一次、重抽一次</td></tr><tr><td>截下携物敌修</td><td>接近后惊动携物敌修，追击并击败旗记目标</td><td>参悟选择一次、额外 8 经验</td></tr><tr><td>山场试阵</td><td>接近后击败三名旗记守卫</td><td>重抽一次</td></tr></tbody></table><p>标准局依次在 00:50、01:30、04:00、07:05、10:10 出现行囊、试阵、据守、追击、行囊；时限分别为 35、50、50、45、35 秒。位置取自现有松亭、残碑、溪岸，并随种子及当时所在位置选择。原有四次定时额外参悟由这四次可选参悟替代，不叠加发放；忽略或失败就错过该次额外选择。</p><p>暂停与选卡冻结时限和进度。可在暂停页放弃，不额外扣资源；已惊动敌人仍在场。奖励只结算一次，死亡或超时后击杀不补发机缘奖励，普通击杀经验仍按原规则获得。携物敌修使用现有敌人外形，旗记用于辨认；其撤退仍受定身、迟缓与诱引等现有控制影响。</p><p>无尽模式在 13:00 起每隔 185 秒继续出现一处机缘，三种新事件随种子轮换；已完成或放弃的同一时段不会重复刷新。终阵期间停止新机缘。</p><p>器物技、F 手动神通（明阳成型后为蓄能果位）、E 挪移和 Q 竭命满足条件时，按钮底边显示就绪标记；点击仍按真实目标、法力与冷却判断。竭命生效时显示真实剩余增伤时间；明阳成型后 F 改为蓄能六合敕令，按钮显示能量与就绪状态。</p><h2>结算与修行录</h2><p>结算显示本局搭配、果位、主修、多次机缘结果及实际受伤来源；施放次数只表示主动发动次数，不代表伤害贡献。可以同器物开新局，或同种子重开。重开不会复制本局成长，同种子也会因操作、选择和版本不同而有不同进程。</p><p>记录保存在当前浏览器本地，可导出备份或合并导入；最多保留最近 500 条局记录，最佳纪录和达成印独立保留。不保存战斗中途进度，旧版未记录的信息不补造。存档无法读取时暂停写入，避免覆盖，可先导出本次记录。</p><p>继续使用启动脚本的固定地址 http://127.0.0.1:18743/ 和同一浏览器；清理浏览器数据可能清除纪录。关闭服务终端即可停止游戏服务。音量与减少装饰动效设置会保留，危险预警始终显示。</p><h2>山场机缘的改编边界</h2><p>山场机缘是本作关卡设计，不是原著命名能力或具体情节复刻。散落行囊、据地御敌、携物敌修采用现有山场和敌人：分别以连续停留、累计据守、追击击杀取得局内参悟；不声称拾得原著神通传承。参悟选择、重抽、计时、撤退速度及额外经验属于游戏规则，不修改神通能力与同参组合。现有箓气保持每局一次选择及既有代价，未增加遗物体系、局内商店或通用蓄能大招。</p><h2>修行强化（0.16.0）</h2><p>修行强化是本作局内成长规则，不是新增原著神通、仙基、箓气或器物固有权柄。这里的「阶」表示强化次数，与神通的一至三重、原著境界、本作评级分别记录；不计入果位同参，重开清空，胜利后继续无尽则保留。</p><p>二级起，普通升级在候选充足时提供两道神通与一项强化。机缘参悟在神通候选不少于三道时只提供神通；满修后使用剩余强化与原有续航选项。缺项保底与重抽继续生效，自由混选。</p><table><thead><tr><th>强化</th><th>每阶变化</th><th>上限</th></tr></thead><tbody><tr><td>固本</td><td>气血上限 +4，同时回复 15 气血至上限</td><td>10 阶</td></tr><tr><td>精进</td><td>基础增伤 +2.5%，普攻与伤害神通受益</td><td>12 阶</td></tr><tr><td>摄物</td><td>拾取距离 +7，普攻索敌 +12；枪刺长度同增</td><td>8 阶</td></tr><tr><td>熟手</td><td>普攻频率 +8%；不改变器物技或神通冷却</td><td>3 阶，+24%</td></tr><tr><td>轻身</td><td>移速 +4%，与箓气、神通移动倍率相乘</td><td>3 阶，+12%</td></tr><tr><td>调元</td><td>常驻回法 +0.6/秒，不增加上限</td><td>3 阶，+1.8/秒</td></tr><tr><td>养息</td><td>常驻回血 +0.15/秒，只在战斗运行时生效</td><td>3 阶，0.45/秒</td></tr></tbody></table><p>养息不恢复寿元、不救致死；与君蹈危脱围复伤、赤断镞记伤返还分别结算，不改动二者记录规则。固本、精进、摄物整合已有成长，数值不重复叠一套。</p><p>习器最多两阶，依本局器物显示对应条目：</p><ul><li>习弓·分矢：每阶增加一支扇射副箭，最多一主两副。主箭伤害不变，副箭为本次主箭伤害的 40%，继承贯穿与破护。整轮只耗一次泉势，不额外触发帝观元追加打击。不自动追踪，不是青乌弓新增固有权柄。</li><li>习剑·展锋：原有自动近身剑扫半径每阶 +20，由 110 至 150；触发距离由 120 至 160，伤害仍为 11，不改变G器物技。</li><li>习枪·贯阵：普通枪刺每阶多命中一敌，基础上限由二至四敌；原有洞泉声、镂金石贯穿仍可叠加，长度与伤害不变。</li><li>习令·远引：自动单点落雷索敌每阶 +45，由 420 至 510；不增加落雷目标数、伤害或器物技范围。</li><li>重明洞玄屏没有伤害普攻，不提供熟手与习器；摄物只提高拾取能力，不添加画屏攻击、回血或全弹拦截。</li></ul><p>改编边界：这批强化只调节已有攻击形式的发射数量、覆盖、贯穿、索敌与已有基础属性，沿用既有器物事实与考据，不新增原著能力或人物关系。本轮没有新增原著事实主张，未重新逐章考据。各器物和神通说明中的攻击间隔、伤害、范围为未计局内强化的基础值；已选强化可在暂停、神通谱及结算搭配中查看。修行录新增强化快照；旧记录缺项显示未记录，不补造历史。</p><h2>神通评级与出现机会</h2><p>候选卡、已学神通与神通谱直接显示 S／A／B。未学神通的基础抽取权重为 S 0.35、A 0.70、B 1；这是相对权重，不是 35%／70%／100% 的出现率。已有同参路线的未学神通仍乘 1.45，已学神通升重统一权重 1.25。两神通一强化与连续三次未见目标后下次保底不变，保底仍给同参补缺或精修机会。主动放弃候选会延后成型。</p><p>开局仍从原有适配器物的分组中抽三组，各组按平均基础权重抽取，组内再按神通权重抽取；屏风开局仍全部是可输出神通。事件与重抽也使用评级权重；定向事件可能缩小候选池，因此实际出现率随场景改变。此评级和获取规则均为游戏改编，不是原著品阶。</p><h2>0.19.0 视觉调整</h2><p>战场评级使用高对比度 S／A／B 紧凑字母，修习重数另列。友方法域去除重复圆环、倒计时弧与常驻名称；青雨保留雨丝，令域保留旗令，险地保留山石，幻饵保留钓线。血漠保留单条真实边界及可用挪移方向。敌方地面危险和冲锋、飞弹预警保留。首页山水图内嵌发行版，可离线打开。</p><h2>F 蓄能主动试行</h2><p>明阳成型解锁唯一 F 蓄能主动槽，首次满能100；原手动神通恢复自动。附近650范围有已入场敌人或敌弹时每秒+2.5能量，普通击杀+0.15、精英+4、首领+8，每次释放后击杀累计最多补12。满能可保留，暂停、参悟、死亡及脱战不按时间蓄能。满能按F或点击按钮，在施放点于0、0.6、1.2秒发出三次六合敕令，半径为普通天下明×1.2；每次伤害22/30/38、禁闭1.6/2/2.4秒并忽略减伤，消除范围内敌弹。消耗全部能量，不耗法力；不清地面危险、不反弹、不无敌、不召仙将。普通天下明仍是单次施放，26法力、8秒冷却；果位的原有令域、甲兵与挪移联动保留。</p><p>原著《六合》支持六合之光的禁闭与消解恶难作用；F主动槽、蓄能、三次节拍、范围和数值均为游戏改编。仅明阳试行蓄能主动，渌水仍维持原有自动效果，不新增第二个果位主动按钮。</p><h2>通用瞬移与按键调整</h2><p>所有器物开局自带通用瞬移：空格或点击按钮，移动140距离，冷却6秒，不耗法力、不增加无敌和伤害。优先当前移动方向；点击走位时朝点击目标；停步沿最后移动方向（初始向右）。瞬移后取消原点击目标；落点受地图边界限制，贴边无法位移时不消耗冷却。暂停、参悟和结束不可释放且冷却不流逝，重开清空。器物技手动键由空格改为G，自动器物技与按钮保留；F果位、E血漠挪移和Q竭命不变。</p><p>通用瞬移为游戏操作规则，不是新增原著神通或器物能力；不计入同参。</p>";
</script>
