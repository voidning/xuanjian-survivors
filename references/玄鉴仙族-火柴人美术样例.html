<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>几笔修仙 · 火柴人风格样例</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f3ef;color:#282e31;font-family:system-ui,-apple-system,'PingFang SC',sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}header{position:fixed;top:25px;left:30px;pointer-events:none}h1{margin:0;font-size:19px;font-weight:600;letter-spacing:4px}header p{margin:8px 0;font-size:11px;color:#8a918e;letter-spacing:1px}.label{position:fixed;top:28px;right:30px;color:#969d98;font-size:11px}footer{position:fixed;bottom:23px;left:30px;right:30px;display:flex;justify-content:space-between;align-items:end;gap:20px}.keys{font-size:11px;color:#8a918e;line-height:1.9}.spells{display:flex;gap:8px}button{background:#f9faf7;border:1px solid #d9ded7;border-radius:7px;padding:10px 14px;font:12px inherit;color:#454e4c;cursor:pointer}button:hover{background:#fff;border-color:currentColor}button:focus-visible{outline:2px solid currentColor;outline-offset:3px}button span{font-size:10px;margin-right:7px;opacity:.5}#sword{color:#278dba}#thunder{color:#8c68c4}#shield{color:#b08b32}#auto{font-size:11px;color:#7b857e}#auto[aria-pressed=true]{background:#e6ece4;color:#455d49}@media(max-width:650px){header{top:18px;left:18px}.label{top:21px;right:18px}footer{left:18px;right:18px;bottom:18px;flex-direction:column;align-items:start;gap:10px}button{padding:10px}.keys{font-size:10px}h1{font-size:17px}}

#compass{position:fixed;right:30px;top:65px;width:104px;height:76px;border:1px solid #dde2d9;border-radius:6px;background:#f7f8f399;pointer-events:none}#compass b{position:absolute;width:4px;height:4px;border-radius:50%;background:#596b64;transform:translate(-50%,-50%)}#compass span{position:absolute;bottom:-21px;right:0;white-space:nowrap;font:9px system-ui;color:#9aa498;letter-spacing:1px}.keys{background:#f2f3efd9;padding:4px 0}.spells button{box-shadow:0 1px 2px #26392c05}@media(max-width:650px){#compass{right:18px;top:52px;width:72px;height:53px}}
</style></head><body><canvas id="world" aria-label="火柴人修士与彩色飞剑、雷电、护盾动画"></canvas><header><h1>几笔修仙</h1><p>墨线行旅 · 小人斗法</p></header><div class="label">极简试作 · 02</div><div id="compass"><b id="dot"></b><span>山间 · 3200 × 2200</span></div><footer><div class="keys">WASD / 方向键移动 · 点击地面寻路方向<br>1 飞剑 · 2 雷电 · 3 护盾 · 滚轮缩放</div><div class="spells"><button id="sword"><span>1</span>飞剑</button><button id="thunder"><span>2</span>雷电</button><button id="shield"><span>3</span>护盾</button><button id="auto" aria-pressed="true">自动演示 · 开</button></div></footer><script>
'use strict';
const canvas=document.getElementById('world'),c=canvas.getContext('2d');
const W=3200,H=2200,ink='#30383b';let scale=1,zoom=.88,ox=0,oy=0,last=0,t=0,auto=true,nextAuto=.7,turn=0,moving=false;const keys=new Set(),fx=[],player={x:1600,y:1100,dir:1,cast:0,shield:0},target={x:0,y:0,on:false};
const camera={x:1600,y:1100};
const foes=[{x:1450,y:1020,type:0},{x:1750,y:1000,type:1},{x:1750,y:1190,type:0},{x:1100,y:830,type:0},{x:2120,y:1360,type:1},{x:2350,y:760,type:0},{x:730,y:1510,type:0}];
let seed=391;const rng=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};const scenery=Array.from({length:210},(_,i)=>({x:90+rng()*(W-180),y:100+rng()*(H-200),kind:i%7,size:.6+rng()*.8}));
function view(){scale=zoom;ox=innerWidth/2-camera.x*scale;oy=innerHeight/2-camera.y*scale}

function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';view();c.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function line(points,color=ink,width=3,alpha=1){c.save();c.globalAlpha=alpha;c.strokeStyle=color;c.lineWidth=width;c.lineCap='round';c.lineJoin='round';c.beginPath();points.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.stroke();c.restore()}
function ellipse(x,y,rx,ry,color,stroke=false,width=2){c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);if(stroke){c.strokeStyle=color;c.lineWidth=width;c.stroke()}else{c.fillStyle=color;c.fill()}}
function figure(x,y,kind,phase,walk,dir=1,casting=0){c.save();c.translate(x,y);c.scale(.80,.80);ellipse(0,3,17,4,'#dce0d9');const bob=walk?Math.sin(phase*10)*1.4:0;c.translate(0,bob);c.scale(dir,1);const stride=walk?Math.sin(phase*10)*9:1;
if(kind===1){ellipse(0,-27,10,10,'#f2f3ef');ellipse(0,-27,10,10,ink,true,2.5);const flap=Math.sin(phase*7)*6;line([[-9,-26],[-25,-40+flap],[-36,-30+flap],[-25,-29],[-17,-18],[-8,-21]],ink,2.5);line([[9,-26],[25,-40+flap],[36,-30+flap],[25,-29],[17,-18],[8,-21]],ink,2.5);line([[-4,-28],[-3,-25]],ink,2);line([[4,-28],[3,-25]],ink,2);c.restore();return}
line([[0,-35],[0,-18]],ink,3);line([[0,-18],[-7-stride/2,-8],[-9-stride,0]],ink,3);line([[0,-18],[7+stride/2,-9],[9+stride,0]],ink,3);
if(kind===2){line([[-7,-29],[-14,-18],[-9,-13]],ink,3);line([[5,-29],[14,-20],[10,-13]],ink,3)}else{line([[0,-31],[-10,-22],[-16,-26]],ink,3);line([[0,-31],[10,casting?-36:-22],[casting?23:18,casting?-39:-27]],ink,3);line([[15,-18],[26,-52]],'#626e70',1.5);line([[25,-49],[27,-57],[28,-49]],'#839590',1);line([[-5,-27],[-7,-18],[0,-16]],'#b4bcb5',1);line([[17,-24],[25,-21]],ink,2);line([[-5,-16],[2,-13],[8,-17]],'#7c8582',1.5)}
ellipse(0,-46,11,12,'#f2f3ef');ellipse(0,-46,11,12,ink,true,2.5);
if(kind===2){line([[-8,-55],[-11,-64],[-3,-57]],ink,2.5);line([[7,-55],[12,-62],[10,-52]],ink,2.5);line([[-5,-47],[-2,-46]],ink,2);line([[5,-47],[2,-46]],ink,2)}else{ellipse(-3,-61,4,4,ink);line([[-8,-56],[5,-57],[15,-53+Math.sin(phase*3)*2],[20,-57+Math.sin(phase*3)*2]],ink,1.6);line([[4,-47],[5,-47]],ink,2)}c.restore()}
function cast(kind){player.cast=.45;const sorted=[...foes].sort((a,b)=>Math.hypot(a.x-player.x,a.y-player.y)-Math.hypot(b.x-player.x,b.y-player.y));const enemy=sorted[turn++%Math.min(3,sorted.length)];if(kind==='sword'){for(let i=0;i<3;i++)fx.push({kind,x:player.x,y:player.y-21,tx:enemy.x,ty:enemy.y-17,age:-i*.11,life:.7});}if(kind==='thunder')fx.push({kind,x:enemy.x,y:enemy.y-15,age:0,life:.55});if(kind==='shield')player.shield=2.6;}
for(const kind of ['sword','thunder','shield'])document.getElementById(kind).onclick=()=>cast(kind);
document.getElementById('auto').onclick=()=>{auto=!auto;document.getElementById('auto').setAttribute('aria-pressed',String(auto));document.getElementById('auto').textContent='自动演示 · '+(auto?'开':'关')};
addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d','1','2','3'].includes(k)){e.preventDefault();keys.add(k);target.on=false;if(!e.repeat&&'123'.includes(k))cast(['sword','thunder','shield'][Number(k)-1]);}});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>{keys.clear();target.on=false;last=0});document.addEventListener('visibilitychange',()=>{last=0;keys.clear()});canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.55,Math.min(1.4,zoom-e.deltaY*.0007));view()},{passive:false});
canvas.addEventListener('pointerdown',e=>{target.x=Math.max(65,Math.min(W-65,(e.clientX-ox)/scale));target.y=Math.max(65,Math.min(H-65,(e.clientY-oy)/scale));target.on=true});
function frame(ms){const dt=last?Math.min(.04,(ms-last)/1000):0;last=ms;t+=dt;let vx=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft')),vy=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'));if(target.on&&!vx&&!vy){vx=target.x-player.x;vy=target.y-player.y;if(Math.hypot(vx,vy)<3){target.on=false;vx=vy=0}}let len=Math.hypot(vx,vy);moving=len>0;if(len){player.x=Math.max(65,Math.min(W-65,player.x+vx/len*180*dt));player.y=Math.max(65,Math.min(H-65,player.y+vy/len*180*dt));if(vx)player.dir=vx>0?1:-1}player.cast=Math.max(0,player.cast-dt);player.shield=Math.max(0,player.shield-dt);if(auto){nextAuto-=dt;if(nextAuto<=0){cast(['sword','thunder','shield'][Math.floor(t/2)%3]);nextAuto=1.9}}
camera.x+=(player.x-camera.x)*(1-Math.exp(-dt*7));camera.y+=(player.y-camera.y)*(1-Math.exp(-dt*7));view();document.getElementById('dot').style.left=player.x/W*100+'%';document.getElementById('dot').style.top=player.y/H*100+'%';c.save();const d=Math.min(devicePixelRatio||1,2);c.setTransform(d,0,0,d,0,0);c.fillStyle='#f2f3ef';c.fillRect(0,0,innerWidth,innerHeight);c.translate(ox,oy);c.scale(scale,scale);
// 稀疏地景与贯穿地图的石径，地景只作视觉提示。
c.save();c.strokeStyle='#e3e7de';c.lineWidth=1.2;c.beginPath();c.moveTo(290,0);c.bezierCurveTo(350,650,1750,620,1600,1100);c.bezierCurveTo(1470,1600,2660,1720,2800,2200);c.stroke();c.beginPath();c.moveTo(320,0);c.bezierCurveTo(380,650,1780,620,1630,1100);c.bezierCurveTo(1500,1600,2690,1720,2830,2200);c.stroke();c.restore();
for(const q of scenery){if(Math.abs(q.x-camera.x)>innerWidth/scale/2+120||Math.abs(q.y-camera.y)>innerHeight/scale/2+160)continue;c.save();c.translate(q.x,q.y);c.scale(q.size,q.size);
if(q.kind<3){line([[-3,0],[-5,-5],[0,0],[3,-7]],'#bbc3b8',1)}
else if(q.kind<5){line([[-16,0],[-11,-10],[-2,-15],[12,-10],[18,1],[3,4],[-16,0]],'#adb7ac',1.2);line([[-2,-15],[0,-4],[12,-2]],'#c9d0c5',1);ellipse(0,5,19,2,'#e7eae2')}
else if(q.kind===5){line([[-2,0],[3,-18],[-2,-32],[8,-56]],'#8e9e91',1.6);line([[2,-24],[17,-35],[25,-38]],'#9daa9b',1.3);line([[-2,-32],[-16,-40],[-24,-38]],'#9daa9b',1.3);line([[-30,-40],[-20,-46],[-8,-43]],'#b4bfb0',1.2);line([[7,-56],[0,-51],[19,-52],[27,-56]],'#a7b5a5',1.3);line([[15,-37],[29,-41],[36,-37]],'#b4bfb0',1.2)}
else{line([[-16,1],[14,1]],'#c5cdc1',1);line([[-9,0],[-9,-22],[9,-22],[9,0]],'#b4beb0',1.2);line([[-15,-22],[0,-29],[16,-22]],'#a4b09f',1.2);ellipse(0,-14,2,2,'#bec7b6')}
c.restore()}
// 地图边缘轻线，主角始终留在世界范围内。
c.strokeStyle='#dce2d6';c.lineWidth=1;c.strokeRect(45,45,W-90,H-90);
if(target.on){ellipse(target.x,target.y,5,2,'#b3bdb0',true,1)}
foes.forEach((e,i)=>figure(e.x,e.y,e.type===1?1:2,t+i,false));figure(player.x,player.y,0,t,moving,player.dir,player.cast>0);
if(player.shield>0){let a=Math.min(1,player.shield);c.save();c.globalAlpha=a;ellipse(player.x,player.y-20,25,30,'#bba255',true,2);ellipse(player.x,player.y+2,23,6,'#dace9d',true,1);c.restore()}
for(let i=fx.length-1;i>=0;i--){let f=fx[i];f.age+=dt;if(f.age<0)continue;let q=f.age/f.life;if(q>=1){fx.splice(i,1);continue}if(f.kind==='sword'){let a=Math.atan2(f.ty-f.y,f.tx-f.x),r=Math.min(1,q*1.6),x=f.x+(f.tx-f.x)*r,y=f.y+(f.ty-f.y)*r;c.save();c.translate(x,y);c.rotate(a);c.scale(.72,.72);line([[-37,0],[-15,0]],'#80c5d8',2,1-q);line([[-12,-3],[13,0],[-12,3]],'#339dbb',2,1-q*.5);line([[-12,0],[-22,0]],'#339dbb',2);line([[-14,-5],[-14,5]],'#339dbb',2);c.restore();if(r===1){for(let j=0;j<5;j++){let a=j*1.256;line([[x+Math.cos(a)*6,y+Math.sin(a)*6],[x+Math.cos(a)*14,y+Math.sin(a)*14]],'#53aec4',1.5,1-q)}}}else{let x=f.x,y=f.y;line([[x+9,y-98],[x-9,y-70],[x+3,y-65],[x-12,y-35],[x,y-39],[x-4,y]],'#9c77c6',2.5,1-q);line([[x-10,y-43],[x-27,y-56],[x-24,y-68]],'#bda3d8',1.5,1-q);ellipse(x,y+17,12+q*20,4+q*5,'#bda3d8',true,1);}}
c.fillStyle='#a5ada5';c.font='11px system-ui';c.textAlign='center';c.font='9px system-ui';c.fillText('修士',player.x,player.y+19);c.restore();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
